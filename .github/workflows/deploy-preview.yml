# Deploy the develop branch to preview.a-dna.org via Vercel.
#
# Required GitHub repository secrets:
#   VERCEL_TOKEN              — Vercel → Account Settings → Tokens
#   VERCEL_ORG_ID             — .vercel/project.json after `vercel link`, or Team/Account ID
#   VERCEL_PROJECT_ID         — .vercel/project.json after `vercel link`
#   VITE_SUPABASE_URL         — Supabase project URL (baked into the Vite build)
#   VITE_SUPABASE_PUBLISHABLE_KEY — Supabase publishable key
#
# One-time Vercel / DNS setup:
#   1. Link the repo in Vercel (or run `vercel link` locally).
#   2. Add preview.a-dna.org under Project → Settings → Domains.
#   3. Point DNS: CNAME preview → cname.vercel-dns.com
#
# If Vercel Git auto-deploy is also enabled for develop, disable it to avoid
# duplicate deployments (Project → Settings → Git → Ignored Build Step, or
# assign preview.a-dna.org to the develop branch in Domains instead of this workflow).

name: Deploy Develop Preview

on:
  push:
    branches: [develop]

concurrency:
  group: deploy-preview-develop
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to preview.a-dna.org
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Alias preview.a-dna.org
        run: vercel alias set "${{ steps.deploy.outputs.url }}" preview.a-dna.org --token="$VERCEL_TOKEN"
